# Доменный пакет: карточные и платёжные функции банка в Казахстане.
# Правило срабатывает, когда в документе есть тема (when), но нет обязательного уточнения (unless).
# when пустой — тема обязательна для любого ТЗ на изменение банковского продукта.
# Из каждого срабатывания получается находка «неполнота набора» и готовый вопрос автору.
id: fintech-kz
title: Финтех, карты и платежи (Казахстан)
version: 1

# Пакет применяется, только если документ говорит о платежах, картах или деньгах.
appliesWhen: ['карт\p{L}*', 'плат[её]ж\p{L}*', 'перевод\p{L}*', 'сч[её]т\p{L}*', 'банк\p{L}*', 'тенге', '₸', 'KZT', 'процессинг\p{L}*', 'кредит\p{L}*', 'депозит\p{L}*', 'payment', 'card']

# Линзы — типовые вопросы предметной области, которые модель примеряет к документу на этапе поиска пропусков.
lenses:
  - Событие приходит с опозданием, после закрытия периода, или не по порядку (например, возврат раньше покупки). Что меняется в уже закрытом периоде и что увидит клиент?
  - Два события обрабатываются одновременно и вместе пересекают границу. Сколько раз выполнится действие?
  - Настройка изменена между совершением операции и её обработкой. Какое значение настройки применяется к операции?
  - Смежная система недоступна или отвечает ошибкой. Функция повторяет попытку, откладывает, теряет событие? Что видит клиент?
  - На какой объект действует правило — карта, счёт, клиент? Что происходит при нескольких картах, дополнительной карте, перевыпуске, блокировке, закрытии?
  - Перечни «входит / не входит» закрыты? По какому признаку операция относится к классу (тип операции, MCC, канал, статус)?
  - Для каждого термина, от которого зависит расчёт (момент операции, статус операции, состояние объекта), есть определение, привязанное к данным смежной системы?
  - Для каждой суммы названы единица, валюта и округление; для каждой даты — часовой пояс и то, какая метка времени берётся.
  - Один и тот же факт хранится или задаётся в двух местах? Какой источник главный и как они синхронизируются?
  - Для каждого кода ответа API есть условие возврата, тело ответа и состояние данных после ответа? Обязательность параметра не противоречит сценариям (например, выключение функции)?
  - Какое состояние видит клиент до первого сохранения настройки и после её выключения? Что происходит с накопленными данными?
  - Данные клиента в сообщениях, журналах и адресах запросов — кто их видит и где они остаются?

# Словарь — принятые в отрасли названия. Агент использует их в замечаниях, чтобы читатель из банка сразу узнал проблему.
vocabulary:
  - авторизация и холд (блокировка суммы) — момент покупки; клиринг (финансовое подтверждение, списание) — момент проведения
  - реверсал — отмена авторизации; возврат (refund) — отдельная операция; чарджбэк — оспаривание
  - MCC и тип операции — признак, по которому операция относится к покупке, переводу, снятию наличных, квази-кэшу
  - идемпотентность и ключ идемпотентности — защита от повторной доставки события; дедупликация
  - гонка (одновременная обработка), порядок событий, событие не по порядку
  - часовой пояс UTC+5 (Asia/Almaty), граница периода, закрытый период
  - минорные единицы (тиын), округление, курс конвертации
  - маскирование PAN, последние 4 цифры, экран блокировки
  - SLA и SLO, перцентиль (p95, p99), пиковая нагрузка, доступность
  - основная и дополнительная карта, перевыпуск, блокировка, закрытие карты
  - флаг функции (feature flag), откат, деградация при недоступности смежного сервиса

omissions:
  - id: F-001
    title: Не задан часовой пояс и момент времени, по которому считается период
    when: ['по Алматы', 'в Алматы', 'по Астане', 'календарн\p{L}* месяц', 'за месяц', 'в месяц', 'за сутки', 'в сутки', 'за день', 'дневн\p{L}* лимит']
    unless: ['UTC\s?[+-]\s?\d', 'Asia/Almaty', 'GMT\s?[+-]\s?\d', 'часов\p{L}* пояс']
    severity: major
    risk: { level: high, kind: money }
    addressee: Аналитик и владелец процессинга
    explanation: >-
      Период учёта привязан ко времени, но часовой пояс не назван, и не сказано, какая метка времени определяет период —
      время авторизации или время проведения операции. С 1 марта 2024 года в Казахстане единый пояс UTC+5,
      поэтому «время Алматы» в старых системах и библиотеках может означать UTC+6. На границе периода одна и та же
      операция попадёт в разные периоды в зависимости от трактовки.
    question: По какой метке времени и в каком часовом поясе операция относится к периоду?
    options:
      - { label: 'Время авторизации, UTC+5 (Asia/Almaty)', consequence: 'Счётчик меняется в момент покупки; проведение на следующий день период не меняет.' }
      - { label: 'Время проведения (клиринга), UTC+5', consequence: 'Покупка в последние минуты периода попадёт в следующий период; клиент увидит расхождение с выпиской.' }
    default: Считаем по времени авторизации в UTC+5 (Asia/Almaty).
    norm: Единый часовой пояс UTC+5 в Республике Казахстан с 01.03.2024

  - id: F-002
    title: Не описан учёт операций в иностранной валюте
    when: ['KZT', '₸', 'тенге', 'тиын']
    unless: ['иностранн\p{L}* валют', 'конверт\p{L}*', 'конверс\p{L}*', 'курс\p{L}* ', 'мультивалют\p{L}*', 'USD', 'EUR', 'только в (?:тенге|KZT)']
    severity: major
    risk: { level: medium, kind: money }
    addressee: Аналитик
    explanation: >-
      Суммы заданы в тенге, но не сказано, как учитывается покупка в другой валюте по этой же карте:
      по какой сумме и по какому курсу она входит в счётчик, и что происходит при пересчёте суммы на проведении.
    question: Как учитывается покупка в иностранной валюте по карте в тенге?
    options:
      - { label: 'По сумме блокировки в тенге на момент авторизации', consequence: 'Итог может разойтись с выпиской после проведения по другому курсу.' }
      - { label: 'По сумме проведения в тенге', consequence: 'Счётчик изменится с задержкой до проведения; уведомление придёт позже покупки.' }
      - { label: 'Такие операции не учитываются', consequence: 'Клиент не получит уведомление, хотя деньги потрачены.' }
    default: Учитываем сумму списания в тенге на момент авторизации и корректируем при проведении.

  - id: F-003
    title: Не определён ключ идемпотентности и порядок обработки событий
    when: ['повторн\p{L}* доставк\p{L}*', 'событи\p{L}*', 'процессинг\p{L}*', 'очеред\p{L}*', 'webhook', 'callback']
    unless: ['идемпотент\p{L}*', 'дедупликац\p{L}*', 'ключ\p{L}* (?:события|операции|идемпотент)', 'idempoten\p{L}*', 'exactly[- ]once']
    severity: major
    risk: { level: high, kind: money }
    addressee: Архитектор интеграции
    explanation: >-
      Система получает события от процессинга, которые на практике приходят повторно и не по порядку.
      В документе не названо поле, по которому определяется дубль, срок хранения этого ключа и поведение
      при событии, пришедшем раньше предыдущего. Без этого повтор события удвоит сумму или вызовет второе уведомление.
    question: По какому полю распознаётся повторное событие и что делать с событием, пришедшим не по порядку?
    options:
      - { label: 'Ключ — идентификатор операции процессинга, дубль игнорируется', consequence: 'Нужно хранить идентификаторы операций весь период и описать это в требованиях к данным.' }
      - { label: 'Ключ — идентификатор события доставки', consequence: 'Две доставки одной операции с разными идентификаторами события будут учтены дважды.' }
    default: Дубль определяется по идентификатору операции; события применяются по времени операции, а не по времени доставки.

  - id: F-004
    title: Не описан частичный возврат и судьба уже отправленного уведомления
    when: ['возврат\p{L}*', 'refund']
    unless: ['частичн\p{L}*']
    severity: major
    risk: { level: medium, kind: money }
    addressee: Аналитик и владелец процессинга
    explanation: >-
      Возврат упомянут, но не сказано, как учитывается возврат части суммы и что происходит с уже отправленным
      уведомлением, если после возврата накопленная сумма снова ниже порога, а затем опять его достигает.
    question: Как учитывается частичный возврат и возможно ли повторное уведомление после возврата?
    options:
      - { label: 'Любой возврат уменьшает счётчик, повторное пересечение порога уведомляет снова', consequence: 'Клиент может получить больше одного уведомления за период.' }
      - { label: 'Возврат уменьшает счётчик, но уведомление за период остаётся одно', consequence: 'После возврата клиент не узнает о повторном достижении порога.' }
    default: Возврат уменьшает счётчик на сумму возврата; признак отправки уведомления не сбрасывается.

  - id: F-005
    title: Не заданы текст и языки push-уведомления
    when: ['push', 'пуш', 'уведомлени\p{L}*']
    unless: ['шаблон\p{L}* текст\p{L}*', 'тексты push', 'текст\p{L}* (?:push|уведомлени\p{L}*)\s*[:«"]', 'казахск\p{L}*', 'қазақ\p{L}*']
    severity: major
    risk: { level: medium, kind: customer }
    addressee: Владелец продукта
    explanation: >-
      Уведомление — единственный результат функции для клиента, но в документе нет его точного текста и языков.
      Сообщения клиенту в Казахстане готовят на казахском и русском. Тестировщику нечего сверять с ожидаемым результатом.
    question: Какой точный текст уведомления на казахском и русском языках?
    options:
      - { label: 'Текст на языке интерфейса приложения, шаблоны на казахском и русском приложены', consequence: 'В документ добавляется таблица шаблонов; тест сверяет текст дословно.' }
      - { label: 'Один текст на двух языках в одном уведомлении', consequence: 'Уведомление длиннее; нужна проверка обрезки на экране блокировки.' }
    default: Push на языке интерфейса приложения; шаблоны на казахском и русском добавляются в документ.

  - id: F-012
    title: Не описано поведение при недоставке push
    when: ['push', 'пуш']
    unless: ['ошибк\p{L}* доставк\p{L}*', 'недоставк\p{L}*', 'не доставлен\p{L}*', 'повтор\p{L}* отправк\p{L}*', 'SMS', 'смс', 'резервн\p{L}* канал\p{L}*']
    severity: major
    risk: { level: medium, kind: customer }
    addressee: Владелец продукта и владелец сервиса уведомлений
    explanation: >-
      Доставку push не гарантируют ни APNs, ни FCM, а клиент может отключить уведомления.
      В документе нет ни повторных попыток, ни резервного канала, ни признака «доставлено», поэтому неясно,
      считается ли требование выполненным, если уведомление отправлено, но не получено.
    question: Что происходит, если push не доставлен или уведомления у клиента отключены?
    options:
      - { label: 'Только push, без резервного канала', consequence: 'Клиент с выключенными уведомлениями не узнает о достижении порога.' }
      - { label: 'Push, при недоставке за N минут — SMS', consequence: 'Появляются затраты на SMS и требование к отслеживанию статуса доставки.' }
      - { label: 'Push и запись в ленте уведомлений приложения', consequence: 'Нужен раздел в приложении, которого в описании интерфейса нет.' }
    default: Push и запись в ленте уведомлений; SMS не отправляется.

  - id: F-006
    title: В уведомлении передаются данные карты и сумма без правил показа
    when: ['последни\p{L}* (?:четыре|4) цифр\p{L}*', 'номер\p{L}* карт\p{L}*', 'PAN']
    unless: ['маскир\p{L}*', 'экран\p{L}* блокировк\p{L}*', 'скрыт\p{L}* (?:сумм|содержим)\p{L}*', 'PCI', 'банковск\p{L}* тайн\p{L}*']
    severity: major
    risk: { level: high, kind: compliance }
    addressee: Информационная безопасность
    explanation: >-
      В уведомление попадают цифры карты и сумма расходов. Push показывается на экране блокировки и проходит
      через серверы Apple и Google, поэтому документ должен зафиксировать, какие именно данные допустимо показывать
      и нужно ли скрывать сумму. Правило маскирования номера карты и согласование с ИБ в документе отсутствуют.
    question: Какие данные карты и суммы разрешено показывать в push на экране блокировки?
    options:
      - { label: 'Последние 4 цифры и сумма', consequence: 'Сумма расходов видна посторонним на заблокированном телефоне.' }
      - { label: 'Только факт достижения порога, детали — после входа в приложение', consequence: 'Меньше пользы от уведомления, зато нет раскрытия сведений.' }
    default: Показываем последние 4 цифры без суммы; сумма видна после входа в приложение.
    norm: PCI DSS v4.0.1, требования 3.4.1 (маскирование PAN при показе) и 4.2.2 (PAN в пользовательских сообщениях)

  - id: F-007
    title: Нефункциональные требования не содержат измеримых показателей нагрузки и доступности
    when: []
    anchor: nonfunctional
    unless: ['p\s?9[059]', 'перцентил\p{L}*', 'RPS', 'запрос\p{L}* в секунду', 'событи\p{L}* в секунду', 'операци\p{L}* в секунду', 'доступност\p{L}* \d', 'SLA', 'SLO', '99[.,]\d']
    severity: major
    risk: { level: medium, kind: operations }
    addressee: Архитектор и эксплуатация
    explanation: >-
      В документе нет нагрузки, при которой должны выполняться требования ко времени, нет перцентиля и нет доступности.
      Требование «в течение X» без нагрузки и доли запросов нельзя ни спроектировать, ни принять на нагрузочном тесте.
    question: При какой нагрузке и для какой доли операций должно выполняться требование ко времени и какова целевая доступность?
    options:
      - { label: 'Задать p95 и p99 при пиковой нагрузке процессинга', consequence: 'Требование становится проверяемым на нагрузочном тесте.' }
      - { label: 'Оставить без нагрузки', consequence: 'Приёмка по времени невозможна; спор при инциденте не разрешить.' }
    default: p95 при пиковой нагрузке процессинга за последние 12 месяцев; доступность не ниже, чем у сервиса уведомлений.

  - id: F-008
    title: Нет требований к безопасности, журналированию и защите персональных данных
    when: []
    anchor: data
    unless: ['журнал\p{L}* (?:аудит|событи|действи)\p{L}*', 'аудит\p{L}*', 'логирован\p{L}*', 'шифрован\p{L}*', 'персональн\p{L}* данн\p{L}*', 'требования (?:к )?(?:безопасности|ИБ)']
    severity: major
    risk: { level: high, kind: compliance }
    addressee: Информационная безопасность
    explanation: >-
      Функция хранит и передаёт сведения об операциях клиента, но в документе нет ни одного требования
      к защите этих данных: кто имеет доступ, что пишется в журнал, как защищается хранение и передача.
      Сведения об операциях относятся к банковской тайне и персональным данным клиента.
    question: Какие требования к доступу, журналированию и защите данных об операциях предъявляются к этой функции?
    options:
      - { label: 'Применяются типовые требования ИБ банка, дать ссылку на документ', consequence: 'Команда и тестировщики получают проверяемый список.' }
      - { label: 'Специальных требований нет', consequence: 'Нужно письменное подтверждение ИБ; иначе риск замечаний на приёмке.' }
    default: Действуют типовые требования ИБ банка; ссылка добавляется в документ до начала разработки.
    norm: Закон РК «О персональных данных и их защите» от 21.05.2013 № 94-V

  - id: F-009
    title: Не задан срок хранения данных
    when: ['хранить', 'хранени\p{L}*', 'хранилищ\p{L}*']
    unless: ['срок\p{L}* хранени\p{L}*', 'хран\p{L}+ (?:не менее|не более|в течение) \d', 'retention', 'архивац\p{L}*', 'удаля\p{L}+ через']
    severity: minor
    risk: { level: low, kind: compliance }
    addressee: Аналитик и владелец данных
    explanation: Перечислено, что хранить, но не сказано, как долго и что происходит с данными после закрытия карты или отключения функции.
    question: Сколько хранятся накопленные расходы и история уведомлений и когда они удаляются?
    options:
      - { label: 'Текущий и предыдущий период', consequence: 'Возврат по более старой покупке нечем учесть.' }
      - { label: 'Срок, установленный для банковских документов', consequence: 'Больше объём хранения, зато покрыты поздние возвраты и разбор обращений.' }
    default: Храним текущий и 12 предыдущих периодов.

  - id: F-010
    title: Нет плана отката и способа отключить функцию
    when: []
    unless: ['план\p{L}* откат\p{L}*', 'схем\p{L}* откат\p{L}* (?:описан|приведен|:)', 'feature[- ]?(?:flag|toggle)', 'фич\p{L}*[- ]?флаг\p{L}*', 'выключател\p{L}* функци\p{L}*', 'откат выполняется']
    severity: minor
    risk: { level: medium, kind: operations }
    addressee: Архитектор и эксплуатация
