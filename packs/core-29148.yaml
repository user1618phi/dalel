# Языковые критерии требований: ISO/IEC/IEEE 29148:2018 §5.2.7.
# Каждая запись — фрагмент регулярного выражения (без учёта регистра).
# Границы слова добавляет движок, поэтому «быстр\p{L}*» поймает «быстро», «быстрый», «быстрее».
id: core-29148
title: Языковые критерии ISO/IEC/IEEE 29148:2018 §5.2.7
version: 1

lexicon:
  vague:
    title: Размытая или субъективная формулировка
    hint: Заменить измеримым условием — числом, единицей, перечнем значений.
    terms:
      - быстр\p{L}*
      - медленн\p{L}*
      - удобн\p{L}*
      - понятн\p{L}*
      - интуитивн\p{L}*
      - дружественн\p{L}*
      - гибк\p{L}*
      - над[её]жн\p{L}*
      - эффективн\p{L}*
      - оптимальн\p{L}*
      - современн\p{L}*
      - качественн\p{L}*
      - достаточн\p{L}*
      - адекватн\p{L}*
      - разумн\p{L}*
      - приемлем\p{L}*
      - своевременн\p{L}*
      - оперативн\p{L}*
      - значительн\p{L}*
      - корректн\p{L}*
      - должным образом
      - в кратчайшие сроки
      - как можно \p{L}+
      - примерно
      - приблизительно
      - несколько
      - некотор\p{L}*
      - различн\p{L}*
      - обычно
      - зачастую
      - иногда
      - в основном
      # қазақша
      - жылдам
      - тез
      - ыңғайлы
      - оңай
      - сенімді
      - тиімді
      - заманауи
      - шамамен
      - бірнеше
      - әдетте
      - fast
      - quick(?:ly)?
      - user[- ]friendly
      - eas(?:y|ily)
      - flexible
      - robust
      - efficient(?:ly)?
      - adequate(?:ly)?
      - reasonabl[ey]
      - seamless(?:ly)?
      - timely
      - approximately
      - several
      - usually
      - normally
  open_ended:
    title: Открытый перечень
    hint: Перечислить все значения явно; «и далее», «и т.д.» нельзя проверить.
    terms:
      - и\s+т\.\s?д\.?
      - и\s+т\.\s?п\.?
      - и так далее
      - и тому подобн\p{L}*
      - и др\.
      - и другие
      - и проч\p{L}*
      - и далее
      - включая,? но не ограничиваясь
      - және т\.\s?б\.?
      - және т\.\s?с\.\s?с\.?
      - тағы басқа\p{L}*
      - etc\.?
      - and so on
      - including but not limited to
  loophole:
    title: Лазейка в формулировке
    hint: Убрать оговорку или описать точное условие, когда требование действует.
    terms:
      - по возможности
      - при необходимости
      - если применимо
      - если возможно
      - по мере возможности
      - как правило
      - мүмкіндігінше
      - қажет болса
      - қажет болған жағдайда
      - if possible
      - as appropriate
      - as needed
      - where applicable
  superlative:
    title: Превосходная или сравнительная степень без базы сравнения
    hint: Указать значение или эталон, с которым сравнивают.
    terms:
      - наилучш\p{L}*
      - лучш\p{L}*
      - наиболее
      - наименее
      - максимально
      - best
      - most
      - state[- ]of[- ]the[- ]art
  unbounded_time:
    title: Время без измеримой границы
    hint: Задать предел в секундах, перцентиль и нагрузку, при которой он измеряется.
    terms:
      - мгновенн\p{L}*
      - моментальн\p{L}*
      - немедленн\p{L}*
      - сразу
      - в реальном времени
      - в момент \p{L}+
      - immediately
      - instant(?:ly)?
      - real[- ]time
  absolute:
    title: Абсолютное утверждение, которое нельзя проверить
    hint: Ограничить условиями и задать измеримый критерий.
    terms:
      - всегда
      - никогда
      - в любом случае
      - 100\s?%
      - always
      - never
  placeholder:
    title: Незаполненное место
    hint: Заполнить раздел или явно указать «не требуется» с причиной.
    terms:
      - TBD
      - TBA
      - нақтыланады
      - кейін толтырылады
      - TODO
      - уточняется
      - будет уточнен\p{L}*
      - будет определен\p{L}*
      - на согласовании
      - заполня\p{L}+\s+(?:тестировщик|аналитик|позже|разработчик)\p{L}*
      - не заполнен\p{L}*
      - lorem ipsum
      - \?\?\?

# Признаки инструкций, адресованных проверяющей модели, внутри самого документа.
injection:
  - ignore (?:all |any )?(?:previous|prior|above) instructions
  - игнорируй\p{L}* (?:все )?(?:предыдущие|прежние|вышестоящие) (?:инструкции|указания)
  - system prompt
  - системн\p{L}+ промпт\p{L}*
  - (?:поставь|выстав\p{L}+|присвой) (?:максимальн|высш)\p{L}+ (?:оценк|балл)\p{L}*
  - не (?:сообщай|упоминай|указывай|пиши) (?:о |про )?(?:дефект|ошибк|нарушен|противореч)\p{L}*
  - do not (?:report|mention|flag)
  - as an ai
  - (?:ты|вы)\s+[—-]?\s*(?:ии|ai|языковая модель|ассистент)

lenses:
  - Документ сам требует что-то в чек-листе, шаблоне или соседнем разделе (схему отката, диаграмму, согласование, приложение), чего в нём нет?
  - Основной сценарий описан, а альтернативные ветви (условие не выполнено, функция выключена, данных ещё нет) — нет?
  - Текст раздела соответствует его заголовку, а примеры — таблицам и правилам рядом с ними?

